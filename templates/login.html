<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cafunfo Cloud</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        form {
            background-color: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
        }
        button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background-color: #ffcc00;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #e6b800; }
        a { color: #fff; font-size: 0.9em; text-decoration: none; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Entrar</h2>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="senha" placeholder="Senha" required>
        <button type="submit">Login</button>
        <p>Não tem conta? <a href="/registrar">Registrar</a></p>
    </form>
</body>
</html>
