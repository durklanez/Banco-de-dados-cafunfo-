<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            font-family: Arial;
            background: linear-gradient(135deg,#11998e,#38ef7d);
            text-align:center;
            padding-top:80px;
        }

        input{
            padding:12px;
            width:250px;
            margin:10px;
            border-radius:6px;
            border:none;
        }

        button{
            padding:12px;
            width:260px;
            background:black;
            color:white;
            border:none;
            border-radius:6px;
        }
    </style>
</head>

<body>

    <h2>Entrar no Banco</h2>

    <form method="POST">
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="password" name="senha" placeholder="Senha" required><br>
        <button type="submit">Entrar</button>
    </form>

</body>
</html>
