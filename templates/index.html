<h2>Cadastrar vendedor</h2>

<input id="nome" placeholder="Nome"><br>
<input id="produto" placeholder="Produto"><br>
<input id="telefone" placeholder="Telefone"><br>
<button onclick="salvar()">Salvar</button>

<h2>Vendedores</h2>
<ul id="lista"></ul>

<script>
function salvar() {
    fetch("/api/vendedor", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            nome: nome.value,
            produto: produto.value,
            telefone: telefone.value
        })
    }).then(() => carregar())
}

function carregar() {
    fetch("/api/vendedores")
        .then(r => r.json())
        .then(dados => {
            lista.innerHTML = ""
            dados.forEach(v => {
                lista.innerHTML += `<li>${v.nome} - ${v.produto}</li>`
            })
        })
}

carregar()
</script>
