<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 30px;
        }
        h1 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #fff; padding: 10px; text-align: left; }
        th { background-color: rgba(255,255,255,0.2); }
        a.button {
            display: inline-block;
            margin: 10px 0;
            padding: 12px 25px;
            background-color: #ffcc00;
            color: #333;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        a.button:hover { background-color: #e6b800; }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <p>Total de usuários: {{ total_usuarios }}</p>
    <h2>Logs recentes:</h2>
    <table>
        <tr><th>Usuário</th><th>Ação</th><th>Data</th></tr>
        {% for log in logs %}
        <tr>
            <td>{{ log.usuario }}</td>
            <td>{{ log.acao }}</td>
            <td>{{ log.data }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/logout" class="button">Sair</a>
</body>
</html>
